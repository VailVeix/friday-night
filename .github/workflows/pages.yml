name: Publish Friday Night
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check app.js && node --check admin/admin.js && node --check seed.js && node --check series.js && node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public website only
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/build-site.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
